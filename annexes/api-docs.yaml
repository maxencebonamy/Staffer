components:
    schemas:
        Employee:
            required:
                - birthDate
                - firstName
                - hireDate
                - lastName
            type: object
            properties:
                id:
                    type: integer
                    format: int32
                    readOnly: true
                birthDate:
                    type: string
                    format: date
                firstName:
                    type: string
                lastName:
                    type: string
                hireDate:
                    type: string
                    format: date
        Department:
            required:
                - name
            type: object
            properties:
                id:
                    pattern: "d[0-9]{3}"
                    type: string
                    readOnly: true
                name:
                    type: string
        CreateTitleRequest:
            required:
                - fromDate
                - title
            type: object
            properties:
                fromDate:
                    type: string
                    format: date
                title:
                    type: string
        Title:
            required:
                - toDate
            type: object
            properties:
                employee:
                    $ref: '#/components/schemas/Employee'
                title:
                    type: string
                fromDate:
                    type: string
                    format: date
                toDate:
                    type: string
                    format: date
        CreateSalaryRequest:
            required:
                - fromDate
                - salary
            type: object
            properties:
                fromDate:
                    type: string
                    format: date
                salary:
                    type: integer
                    format: int32
        Salary:
            required:
                - salary
                - toDate
            type: object
            properties:
                employee:
                    $ref: '#/components/schemas/Employee'
                salary:
                    type: integer
                    format: int32
                fromDate:
                    type: string
                    format: date
                toDate:
                    type: string
                    format: date
        CreateDepartmentEmployeeRequest:
            required:
                - employeeId
                - fromDate
            type: object
            properties:
                fromDate:
                    type: string
                    format: date
                employeeId:
                    type: integer
                    format: int32
        DepartmentEmployee:
            required:
                - fromDate
                - toDate
            type: object
            properties:
                employee:
                    $ref: '#/components/schemas/Employee'
                department:
                    $ref: '#/components/schemas/Department'
                fromDate:
                    type: string
                    format: date
                toDate:
                    type: string
                    format: date
        Pageable:
            type: object
            properties:
                page:
                    minimum: 0
                    type: integer
                    format: int32
                size:
                    minimum: 1
                    type: integer
                    format: int32
                sort:
                    type: array
                    items:
                        type: string
        PageEmployee:
            type: object
            properties:
                totalPages:
                    type: integer
                    format: int32
                totalElements:
                    type: integer
                    format: int64
                size:
                    type: integer
                    format: int32
                content:
                    type: array
                    items:
                        $ref: '#/components/schemas/Employee'
                number:
                    type: integer
                    format: int32
                sort:
                    $ref: '#/components/schemas/SortObject'
                numberOfElements:
                    type: integer
                    format: int32
                first:
                    type: boolean
                last:
                    type: boolean
                pageable:
                    $ref: '#/components/schemas/PageableObject'
                empty:
                    type: boolean
        PageableObject:
            type: object
            properties:
                offset:
                    type: integer
                    format: int64
                sort:
                    $ref: '#/components/schemas/SortObject'
                pageSize:
                    type: integer
                    format: int32
                pageNumber:
                    type: integer
                    format: int32
                paged:
                    type: boolean
                unpaged:
                    type: boolean
        SortObject:
            type: object
            properties:
                empty:
                    type: boolean
                sorted:
                    type: boolean
                unsorted:
                    type: boolean
        DepartmentManager:
            required:
                - fromDate
                - toDate
            type: object
            properties:
                employee:
                    $ref: '#/components/schemas/Employee'
                department:
                    $ref: '#/components/schemas/Department'
                fromDate:
                    type: string
                    format: date
                toDate:
                    type: string
                    format: date
        PageDepartmentEmployee:
            type: object
            properties:
                totalPages:
                    type: integer
                    format: int32
                totalElements:
                    type: integer
                    format: int64
                size:
                    type: integer
                    format: int32
                content:
                    type: array
                    items:
                        $ref: '#/components/schemas/DepartmentEmployee'
                number:
                    type: integer
                    format: int32
                sort:
                    $ref: '#/components/schemas/SortObject'
                numberOfElements:
                    type: integer
                    format: int32
                first:
                    type: boolean
                last:
                    type: boolean
                pageable:
                    $ref: '#/components/schemas/PageableObject'
                empty:
                    type: boolean
